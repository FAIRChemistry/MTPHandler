[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtphandler"
version = "0.2.23"
description = "Python package for processing, enriching, and converting microtiter plate data into standardized EnzymeML time-course data, ready for data science."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
authors = [{ name = "haeussma", email = "83341109+haeussma@users.noreply.github.com" }]

dependencies = [
  "numpy<=2.1.0",
  "plotly>=6.3.0",
  "pandas[excel]>=2.0",
  "pyenzyme>=2.0.0",
  "calipytion>=1.0.2",
  "rich>=3.7.1",
  "httpx>=0.27.2",
  "loguru>=0.7.3",
  "mdmodels>=0.2.0",
]

[tool.setuptools.packages.find]
include = ["mtphandler*"]

[dependency-groups]
dev = [
  "pre-commit>=3.7.0",
  "mkdocs-material>=9.5.7",
  "pytest>=8.0.0",
  "devtools>=0.12.2",
  "ipykernel>=6.29.4",
  "mkdocstrings-python>=1.11.1",
  "nbval>=0.11.0",
  "mkdocs-jupyter>=0.25.0",
  "mkdocs-plotly-plugin>=0.1.3",
  "notebook<7",
  "jupyter-contrib-nbextensions>=0.7.0",
]

[tool.pytest.ini_options]
markers = [
  "network: test hits a live external API (PubChem); excluded in CI datacenter runs",
]
